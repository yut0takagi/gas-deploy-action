name: 'Deploy Google Apps Script'
description: 'Apps Script API を直接呼び出して Google Apps Script プロジェクトをデプロイします'
branding:
  icon: 'upload-cloud'
  color: 'yellow'

inputs:
  credentials:
    description: 'clasp の .clasprc.json、または {client_id, client_secret, refresh_token} の JSON'
    required: true
  script-id:
    description: 'デプロイ先の scriptId。指定すると単一プロジェクトモードになり、config は無視されます'
    required: false
  root-dir:
    description: 'アップロードするファイルのルートディレクトリ（単一プロジェクトモードのみ）'
    required: false
    default: '.'
  deployment-id:
    description: '更新する既存デプロイの ID。省略すると新規デプロイが作成され Web アプリの URL が変わります'
    required: false
  project-type:
    description: 'webapp | addon | bound | standalone'
    required: false
    default: 'standalone'
  ignore:
    description: '除外パターン（改行区切り）。省略時は .claspignore、それも無ければ既定値を使います'
    required: false
  dry-run:
    description: '差分の表示のみ行い、書き込みを行いません'
    required: false
    default: 'false'
  create-version:
    description: 'バージョン作成とデプロイを行うかどうか'
    required: false
    default: 'true'
  allow-delete:
    description: >-
      事故の規模の削除を許可するかどうか。root-dir の内容はリモートを完全に置換するため、
      指定を誤るとリモートのファイルが失われます。リモートの半数以上（かつ2件以上）が
      削除される場合、既定では書き込みを行わずに失敗します。意図的な一括整理のときだけ
      true を指定してください。dry-run では削除内容を確認するため、この設定に関わらず
      失敗しません。
    required: false
    default: 'false'
  description:
    description: 'バージョンの説明。省略時は ci-<sha7>-<run_number>'
    required: false
  config:
    description: '複数プロジェクトモードで使う設定ファイルのパス（script-id が未指定のときのみ使用）'
    required: false
    default: 'gasdeploy.yml'
  environment:
    description: '複数プロジェクトモードでデプロイする environment 名。config モードでは必須です'
    required: false
  projects:
    description: '複数プロジェクトモードでデプロイするプロジェクト名（カンマ区切り）。all で全プロジェクト'
    required: false
    default: 'all'
  comment-on-pr:
    description: >-
      サマリを PR にコメントするかどうか。ワークフローに permissions: pull-requests: write が
      必要です。PR 以外の実行では何もしません。コメントに失敗してもデプロイは失敗扱いにしません。
    required: false
    default: 'false'
  github-token:
    description: 'PR コメントに使うトークン'
    required: false
    default: ${{ github.token }}
  comment-key:
    description: >-
      コメントを識別するキー。同じキーのコメントは新規作成ではなく更新されます。
      省略時は複数プロジェクトモードでは environment、単一プロジェクトモードでは default。
      1つのワークフローで単一プロジェクトモードを複数回実行する場合は、互いのコメントを
      上書きしないよう明示的に分けてください。
    required: false

outputs:
  changed:
    description: '差分があったかどうか（true / false）'
  version-number:
    description: '作成されたバージョン番号（単一プロジェクトモードのみ）'
  previous-version-number:
    description: >-
      このデプロイが更新される前に指していたバージョン番号（単一プロジェクトモードで
      deployment-id を指定した場合のみ）。ロールバック先としてそのまま rollback アクションの
      version-number に渡せます。更新前に読み取った値なので、Apps Script API の
      読み取り一貫性の問題の影響を受けません。
  deployment-id:
    description: '更新または作成されたデプロイ ID（単一プロジェクトモードのみ）'
  web-app-url:
    description: 'Web アプリの URL（該当する場合、単一プロジェクトモードのみ）'
  summary:
    description: '人間可読のサマリ（Markdown）'
  deployments:
    description: >-
      複数プロジェクトモードでの各プロジェクトの結果（JSON 配列）。対象になったプロジェクトは
      失敗・未実行のものも含めて必ず1件ずつ含まれ、欠けることはありません。各要素は
      project, environment, scriptId, status（deployed | unchanged | failed | skipped の
      いずれか）を持ち、該当する場合のみ versionNumber, previousVersionNumber,
      deploymentId, webAppUrl, error（failed のときのみ、失敗メッセージ）を含みます。

runs:
  using: 'node24'
  # .cjs であること。deploy/package.json の "type": "module" により、
  # .js だと Node が ESM として解釈して CJS バンドルが動かない。
  main: 'dist/index.cjs'
