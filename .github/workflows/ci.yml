name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # git diff --exit-code では未追跡ファイルを見逃す。新しいバンドルが増えたのに
      # コミットされていない状態を検出できないため、必ず git status --porcelain を使う。
      - name: Verify dist is in sync
        run: |
          if [ -n "$(git status --porcelain -- deploy/dist rollback/dist token-check/dist status/dist)" ]; then
            echo "::error::dist がソースと同期していません。'npm run build' を実行してコミットしてください"
            git status --porcelain -- deploy/dist rollback/dist token-check/dist status/dist
            exit 1
          fi

      # バンドルを実際に起動する。ビルドが通り dist が同期していても、
      # モジュール形式の不一致（CJS バンドルを .js のまま置くと
      # deploy/package.json の "type": "module" により ESM 扱いされる等）は
      # 実行して初めて露見する。実際にこの経路で本番が壊れた。
      - name: Smoke-test the bundles
        run: |
          for BUNDLE in deploy/dist/index.cjs rollback/dist/index.cjs token-check/dist/index.cjs status/dist/index.cjs; do
            echo "--- $BUNDLE ---"
            set +e
            OUTPUT=$(node "$BUNDLE" 2>&1)
            set -e
            echo "$OUTPUT"
            # 入力が無いので必ず失敗する。重要なのは「どう失敗したか」。
            #
            # 我々のエラー処理まで到達していれば @actions/core が ::error:: を出力する。
            # モジュール形式の不一致や依存関係の欠落では、そこへ到達する前に Node が
            # 生のエラーを吐いて終わる。
            #
            # 特定のメッセージ文字列で判定しないこと。入力仕様が変わるたびに壊れる。
            if echo "$OUTPUT" | grep -q "::error::" \
               && ! echo "$OUTPUT" | grep -qE "ReferenceError|SyntaxError|Cannot find module|is not defined"; then
              echo "$BUNDLE は正常に読み込まれ、想定どおり入力不足で停止しました"
            else
              echo "::error::$BUNDLE の起動に失敗しました。モジュール形式や依存関係の問題の可能性があります"
              exit 1
            fi
          done
